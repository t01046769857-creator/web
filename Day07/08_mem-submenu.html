<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>submenu</title>
    <style>
        *{margin: 0px;padding: 0px;}
        ul{list-style: none;}

        nav{
            height: 50px;
            background-color: lightgreen;
        }
        nav ul.menu>li{
            display: inline-block;
            border: 1px solid blue;
            padding: 5px 10px;
            margin: 10px;
        }
        nav li.menu_item:hover .submenu{
            display: block;
        }

        nav ul.submenu{
            border: 1px dotted red;
            display: none;
            position: absolute;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="menu">
            <li class="menu_item">
                home
                <ul class="submenu">
                    <li>111</li>
                    <li>111</li>
                    <li>111</li>

                </ul>
            </li>
            <li class="menu_item">
                service
                <ul class="submenu">
                    <li>222</li>
                    <li>222</li>
                    <li>222</li>

                </ul>
            </li>
            <li class="menu_item">
                contact
                <ul class="submenu">
                    <li>333</li>
                    <li>333</li>
                    <li>333</li>

                </ul>
            </li>
        </ul>
    </nav>
</body>
</html>
