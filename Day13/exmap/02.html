<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여러개 마커 표시하기</title>
</head>
<body>
    <div id="map" style="width: 100%; height: 350px;"></div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=699e772ebafc82733dc0f4a0582c1668"></script>
    <script>
        var mapContainer = document.getElementById('map'),
        mapOption = {
            center: new kakao.maps.LatLng(
                33.450705,  
                126.570677
            ),
            level: 3

        };
        var map =new kakao.maps.Map(mapContainer, mapOption);
        // 위도 경도 위치 변환 사이트 https://gps.aply.biz/
        var positions = [
            {
                title : '카카오',
                lating: new kakao.maps.LatLng(33.450705, 126.570677)
            },
            {
                title: '생태연못',
                lating: new kakao.maps.LatLng(33.450936, 126.569477)
            },
            {
                title: '텃밭',
                lating: new kakao.maps.LatLng(37.48598466440946, 126.92994576763118)
            },
            {
                title: '근린공원',
                lating: new kakao.maps.LatLng(33.451393, 126.570738)
            }
        ];

        var imageSrc ='http://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png';
        for(var i = 0; i<positions.length; i ++){
            var imageSize= new kakao.maps.Size(24,35);
            var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

            var marker = new kakao.maps.Marker({
                map:map,
                position : positions[i].lating,
                title : positions[i]. tltle,
                image : markerImage
            });
                }
    </script>
</body>
</html>
