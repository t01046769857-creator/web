<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!-- 내부 스크립트 작성 -->
     <script>
        //산술연산자
        document.write(10+4);
        document.write('<br>');

        document.write(10-4);
        document.write('<br>');

        document.write(10*4);
        document.write('<br>');

        document.write(10/4);
        document.write('<br>');

        //파이썬에 있던 몫을 구하는 연산자 //는 없음. 나머지 연산자 %는 있음.
        //js에서 몫을 구하고 싶다면 나눗셈의 결과에서 소수점 아래를 날리면 됨.

        document.write(parseInt(10/3));
        document.write('<br>');
        document.write(10%3);
        document.write('<br>');

        //0나눗셈 (파이썬에서 에러 js에서는 '무한대')
        document.write(10/0); //infinity
        document.write('<hr>');

        //2. 비교 연산자
        var a=10;
        document.write(a>5); true
        document.write('<br>');
        document.write(a<5); 
        document.write('<br>');
        document.write(a>=5); 
        document.write('<br>');
        document.write(a>=5); 
        document.write('<br>');
        document.write(a==5); 
        document.write('<br>');
        document.write(a!=5); 
        document.write('<br>');
         document.write('<hr>');

        //특이한 비교연산
        var b=10;
        var c="10";
        var d= 10.0;

        //연산자는 자료형은 구분하지 않음==

        document.write(b==c);
        document.write('<br>');
        document.write(b==d);
        document.write('<br>');

        //자료형과 값 모두를 비교해주는 연산자 ===
        document.write(b ===c); //false
        document.write('<br>');

        document.write(b ===d); //정수, 실수 모두 number 타입 true
        document.write('<br>');

        document.write('<hr>');

        //파이썬과 다른 비교연산 규칙
        age=35
        document.write(20<age<30);//true? --한번에 하나씩 연산
        document.write('<br>');

        //js에서는 0,'', underined 를 제외한 모든 값을 true로 인식하며 true역시 1로 인식함. false는 0ㅇ로 인식됨.
        document.write(true ==1);
        document.write('<br>');

        document.write(false==0);
        document.write('<br>');

        document.write(true<10);
        document.write('<hr>');

        //그래서 js에서는 비교 연산을 연달아 작성하지 않음.

        //그럼 2개 이상의 조건을 비교해야 한다면?and(&&), or(||) 논리 연산자
        //3. 논리 연산자[and(&&), or(||), not(!)]
        var age=9;
        var height= 150;
        //놀이 동산 이용제한 조건 비교(나이가 10살 이상 이고키가 140이상)
        if(age>=10 && height>=140){
             document.write('놀이동산 이용가능')
        
        }

        //두 조건 중 하나라도 ok면
        if(age>=10 || height>=140){
             document.write('조건 중에 하나 이상 해당 합니다<br>')
        }
       
        //성인이 아니면 ? 이라는 조건식을 문법적으로 쓸 때
        if(!(age>=20)){
             document.write('no adult<br>')
        }

         document.write('<hr>');

         //4. 비트 연산자[대략적으로]
         //숫자 연산을 2진수로 변환하여 각 비트자리끼리 연산(and(&), or(|), xor(^),...)
        document.write(10 & 2);
        document.write('<br>')

        document.write(10|2);
        document.write('<br>')

        document.write(10 ^ 2)//exclusive or
        document.write('<br>')

        //시프트 연산자 - 비트의 자리를 이동

         document.write(10<<2);//shift --40
         document.write('<br>')

         document.write('10>>2')//right shift -- 2
         document.write('<br>')

         //>> 시프트 연산자는 부호자리는 움직이지 않음.
         //>>>시프트 연산자는 부호자리도 움직여서 부호가 변경될 수 있음.
         //첫번째 비트 자리가 부호를 표시하는 자리이며, 0이면 양수 1이면 음수
         var g= -16;
         document.write(g << 2);//부호는그대로 음수
         document.write('<br>');
         document.write(g>>>2);//부모가 움직여서 양수가 되고 큰 수가 됨.
         document.write('<br>');

         //.write()출력 기능에 너무 큰 수치값을 쓰면 알아서 지수 표현식으로 출력하기도 함,
         document.write(123456789123456789123456789123456789)
         document.write('<br>');

         document.write(Number.MAX_VALUE);//최대 표현 가능 숫ㅈ
         document.write('<hr>')
         //----------------------

         //5. 복합 대인 연산자(산술+대입)
         var num=10;
         document.write(num + '<br>');

         num= num+1;
         document.write(num + '<br>');

         num+=1;
         document.write(num + '<br>');

         num+=3;
         document.write(num + '<br>');

         num-=2;
         document.write(num + '<br>');

         num*=3;
         document.write(num + '<br>');

         num/=5;
         document.write(num + '<br>');
         document.write('<hr>')

         //6. 증감 연산자(변수값의 1 증가 또는 감소를 간결하게 해주는 연산자)
         num= 10;
         num+=1;
         document.write(num + '<br>');

         num++; //1증가를 간단하게
         document.write(num + '<br>');

         num++;
         document.write(num + '<br>');

         //2증가 없음 무조건 1증가

         //연산자 위치를 먼저 써도 됨
         ++num;
         document.write(num + '<br>');

         //1 감소
         num--;
         document.write(num + '<br>');

         --num;
         document.write(num + '<br>');

         //연산자의 순서는 사실 약간의 차이가 있음.
         //num++ : 선 출력 후 연산
         //++num : 선 연산 후 출력

         num=10;
         document.write(num++); //10
         document.write('<br>');
         document.write(num); //11
         document.write('<br>');
         document.write('<br>');
         document.write('<br>');
         document.write('<hr>');

         //7. 삼항 연산자(파이썬과 문법이나 작성 위치가 살짝 다름)
         var x=5;
         var y=(x>10)?'A':'B';
         document.write(y);
         document.write('<br>');

         //응용 [점수에 따른 학점계산]
         var score=75;
         var grade= (score>=90)?'A'(score>=80)?'b':(score>=70)?'c':(score>=60)?'D':'F':
         document.write(grade +"학점");
         document.write('<hr>');
         
         //-----------------


        //연산할 때 추가로 알아야할 형변환 기능(함수)
        //gu프로그램에서 사용자의 입력은 무조건 문자열로 입력됨
        //사용자 입력은 htmldml <input 요소를 사용해야 하지만

        var age= prompt('나이를 입력하세요');
        document.write('나이보다 3살 위:'+ (age+3) + '<br>');
        //문자열을 수치형으로 변환하는 기능
        age= parseInt(age);
        document.write('나이보다 3살 위:'+ (age+3) + '<br>');

        //당연히 변환 가능한 문자열 모양이어야 함.
        document.write(parseInt("486")+'<br>');
        document.write(parseInt("aaa")+'<br>'); //nan(not a number)
        document.write(parseInt("3.14")+'<br>'); //3
        document.write(parseFloat("3.14")+'<br>'); //3.14













     </script>
</head>
<body>
    
</body>
</html>
