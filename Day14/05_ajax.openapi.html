<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="aaa()">다른 서버의 xml 데이터를 읽어오기</button>
    <script>
        function aaa(){
            //다른 서버의 유용한 정보를 읽어오기
            //테스트 용으로 음반  목록 정보를 받아오기
            fetch('https://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=494179480f84ebba867a5d0a4246c609&targetDt=20260611')//CORS 정책 에러 - 다른 서버의 데이터를 클라이언트 측의 js로 직접 요청하는 것은 금지(보안문제)
            .then(function(res){return res.text()})
            .then(function(text){
                alert(text);
            })

            //클라이언트의 js에서는 다른 서버의 open api 정보를 받을 수 없음
            //그래서 내 서버의 백엔드에게 대신 요청해달라고 함(중개 브로커 활용)
        }
    </script>

    <h2>다른 서버의 데이터 읽어오기(내 서버를 중계서버로 활용)</h2>
    <button onclick="bbb()">영화진응 위원회 OPEN API 오늘의 박스 오피스</button>
    <p id="pp"></p>
    <script>
        function bbb(){
            fetch('./openapi.php')
            .then(function(res){return res.text()})
            .then(function(text){
                document.getElementById('pp').innerHTML=text;
            })
        }
    </script>
    
</body>
</html>
