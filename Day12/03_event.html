<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- 내부 스크립트 -->
    <script>
        //바디 안에 있는 h2요소에 글씨를 추가하기 --실행안됨. 
        //바디 영역이 만들기 전에 헤드가 실행되기 때문에 아직 h2 요소가 없는 상태임
        var h2= document.getElementById('aa');
        h2.innerHTML='Hello';

        //위 동작이 될려면 바디 영역의 요소들이 모두 만들어진 후 수행해야 합니다.
        //그래서 바디 요소에 문서로딩이 완료 되었을 때 발생하는 load 이벤트를 처리하기
        function loaded(){
            var h2= document.getElementById('aa');
            h2.innerHTML='Hello';
        }

    </script>

    <!-- 실무에서는 외부 스크립트를 더 선호하며 외부 스크립트를 사용한다면 defer(연기하다)속성으로 onlad 이벤트 처리를 대신할 수 있음 -->
    <script src="./aa.js" defer></script>
    <!-- defer 속성은 외부 스크립트만 가능 내부 스크립트에서 적용 안됨. -->
    
</head>
<body onload="loaded()">
    <h2 id="aa"></h2>
    <h3 id="bb">nice to meet you</h3>

    <hr>

    <!-- 이벤트 처리 함수를 등록하는 또 다른 방법(js 요소를 찾아서 이벤트 처리) -->
    <button  id="btn">click me</button>

    <!-- 또 다른 이벤트 등록 방법 -->
     <button class="kk">버튼</button>
    
</body>
</html>
